<!doctype html><html><head><meta charset="utf-8"><script src="plotly.min.js"></script><style>html,body{margin:0;}#plot{width:100%;}</style></head><body><div id="plot"></div><script>
const plot=document.getElementById('plot');let args={}, busy=false, lastMode=null, attached=false, cachedView=null, lastArgs=null;
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*');}
function value(selection){send('streamlit:setComponentValue',{value:{selection,mode:args.mode},dataType:'json'});}
function storageKey(){return 'geochem-map-view:'+args.identity;}
function readView(){if(cachedView && cachedView.identity===args.identity)return cachedView;try{return JSON.parse(sessionStorage.getItem(storageKey())||'null');}catch(e){return null;}}
function point(p){return {x:p.x,y:p.y,curve_number:p.curveNumber,point_index:p.pointIndex};}
async function render(a){
 const fingerprint=JSON.stringify(a);if(fingerprint===lastArgs)return;lastArgs=fingerprint;
 args=a;busy=true;const fig=JSON.parse(a.figure);const view=readView();
 fig.layout=fig.layout||{};fig.layout.xaxis=fig.layout.xaxis||{};fig.layout.yaxis=fig.layout.yaxis||{};
 if(view && view.revision===a.revision){
  fig.layout.xaxis.range=view.x;fig.layout.yaxis.range=view.y;
  fig.layout.xaxis.autorange=false;fig.layout.yaxis.autorange=false;
 }
 if(lastMode!==a.mode){fig.layout.dragmode=a.mode;lastMode=a.mode;}
 else if(view && view.revision===a.revision && view.dragmode){fig.layout.dragmode=view.dragmode;}
 fig.layout.uirevision=a.revision;fig.layout.height=700;
 await Plotly.react(plot,fig.data,fig.layout,{responsive:true,displaylogo:false,scrollZoom:true,doubleClick:false});
 if(!attached){
  plot.on('plotly_relayout',()=>{
   if(busy)return;
   cachedView={identity:args.identity,revision:args.revision,x:[...plot._fullLayout.xaxis.range],y:[...plot._fullLayout.yaxis.range],dragmode:plot._fullLayout.dragmode};
   try{sessionStorage.setItem(storageKey(),JSON.stringify(cachedView));}catch(e){}
  });
  plot.on('plotly_selected',e=>{
   if(!e||!args.selectable)return;
   const s={points:(e.points||[]).map(point),box:[],lasso:[]};
   if(e.range)s.box=[{x:e.range.x,y:e.range.y}];
   if(e.lassoPoints)s.lasso=[e.lassoPoints];
   if(s.box.length||s.lasso.length)value(s);
  });
  plot.on('plotly_click',e=>{
   if(!args.selectable || !args.pointMode || !e.points.length)return;
   value({points:[point(e.points[0])],box:[],lasso:[]});
  });attached=true;
 }
 busy=false;send('streamlit:setFrameHeight',{height:710});
}
let queue=Promise.resolve();window.addEventListener('message',e=>{if(e.source===parent && e.data.type==='streamlit:render')queue=queue.then(()=>render(e.data.args)).catch(err=>{plot.textContent='Map rendering failed: '+err;busy=false;});});
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:710});
</script></body></html>
