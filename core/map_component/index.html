<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;}#plot{width:100%;}</style></head><body><div id="plot"></div><script>
const plot=document.getElementById('plot');let args={}, busy=false, lastMode=null, attached=false, cachedView=null, lastArgs=null;
// Announce readiness before downloading Plotly, avoiding a false component
// startup timeout on a slow connection. Keep the renderer bundled locally.
plot.textContent='Loading map renderer…';
const plotlyReady=new Promise((resolve,reject)=>{
 const script=document.createElement('script');script.src='plotly.min.js';
 script.onload=resolve;script.onerror=()=>reject(new Error('Cannot load plotly.min.js. Ensure core/map_component/plotly.min.js is present in the deployed repository, then reload.'));
 document.head.appendChild(script);
});
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*');}
function value(selection){send('streamlit:setComponentValue',{value:{selection,mode:args.mode,event_id:Date.now()},dataType:'json'});}
function storageKey(){return 'geochem-map-view:'+args.identity;}
function readView(){if(cachedView && cachedView.identity===args.identity)return cachedView;try{return JSON.parse(sessionStorage.getItem(storageKey())||'null');}catch(e){return null;}}
function point(p){return {x:p.x,y:p.y,curve_number:p.curveNumber,point_index:p.pointIndex};}
async function render(a){
 await plotlyReady;
 if(!attached)plot.textContent="";
 if(lastArgs && Object.keys(a).length===Object.keys(lastArgs).length && Object.keys(a).every(key=>a[key]===lastArgs[key]))return;
 lastArgs=a;
 args=a;busy=true;const fig=JSON.parse(a.figure);const view=readView();
 fig.layout=fig.layout||{};fig.layout.xaxis=fig.layout.xaxis||{};fig.layout.yaxis=fig.layout.yaxis||{};
 const bounds=fig.layout.meta && fig.layout.meta.full_data_bounds;
 if(bounds){
  const reverseX=fig.layout.xaxis.autorange==='reversed';
  const reverseY=fig.layout.yaxis.autorange==='reversed';
  fig.layout.xaxis.range=reverseX?[bounds[1],bounds[0]]:[bounds[0],bounds[1]];fig.layout.yaxis.range=reverseY?[bounds[3],bounds[2]]:[bounds[2],bounds[3]];
  fig.layout.xaxis.autorange=false;fig.layout.yaxis.autorange=false;

 }
 if(view && view.revision===a.revision){
  fig.layout.xaxis.range=view.x;fig.layout.yaxis.range=view.y;
  fig.layout.xaxis.autorange=false;fig.layout.yaxis.autorange=false;
 }
 if(lastMode!==a.mode){fig.layout.dragmode=a.mode;lastMode=a.mode;}
 else if(view && view.revision===a.revision && view.dragmode){fig.layout.dragmode=view.dragmode;}
 // Heatmap defaults can compress axis domains after a narrow box zoom.
 // Hold the viewport fixed and let equal-scale constraints expand the ranges.
 fig.layout.xaxis.domain=[0,1];fig.layout.yaxis.domain=[0,1];
 fig.layout.xaxis.constrain='range';fig.layout.yaxis.constrain='range';
 fig.layout.uirevision=a.revision;
 const margin=fig.layout.margin||{};
 const usableWidth=Math.max(300,plot.clientWidth-(margin.l||80)-(margin.r||100));
 const ratio=bounds ? (bounds[3]-bounds[2])/(bounds[1]-bounds[0]) : 0.65;
 fig.layout.height=Math.round(Math.max(500,Math.min(1400,usableWidth*ratio+(margin.t||45)+(margin.b||65))));
 await Plotly.react(plot,fig.data,fig.layout,{responsive:true,displaylogo:false,scrollZoom:true,doubleClick:false});
 if(!attached){
  plot.on('plotly_relayout',()=>{
   if(busy)return;
   cachedView={identity:args.identity,revision:args.revision,x:[...plot._fullLayout.xaxis.range],y:[...plot._fullLayout.yaxis.range],dragmode:plot._fullLayout.dragmode};
   try{sessionStorage.setItem(storageKey(),JSON.stringify(cachedView));}catch(e){}
  });
  plot.on('plotly_selected',e=>{
   if(!e||!args.selectable)return;
   const s={points:[],box:[],lasso:[]};
   if(e.range)s.box=[{x:e.range.x,y:e.range.y}];
   if(e.lassoPoints)s.lasso=[{x:Array.from(e.lassoPoints.x,Number),y:Array.from(e.lassoPoints.y,Number)}];
   if(s.box.length||s.lasso.length)value(s);
  });
  plot.on('plotly_deselect',()=>{if(args.selectable)value({points:[],box:[],lasso:[]});});
  plot.on('plotly_click',e=>{
   if(!args.selectable || !args.pointMode || !e.points.length)return;
   value({points:[point(e.points[0])],box:[],lasso:[]});
  });attached=true;
 }
 busy=false;send('streamlit:setFrameHeight',{height:fig.layout.height+10});
}
// Tabs can initialize an iframe at zero width. Recompute layout when it
// becomes visible so legends, text measurements, and axes use its real size.
let observedWidth=0;
new ResizeObserver(()=>{
 const width=plot.getBoundingClientRect().width;
 if(width>0 && width!==observedWidth){
  observedWidth=width;
  if(attached) requestAnimationFrame(()=>Plotly.Plots.resize(plot));
 }
}).observe(document.documentElement);
let queue=Promise.resolve();window.addEventListener('message',e=>{if(e.source===parent && e.data.type==='streamlit:render')queue=queue.then(()=>render(e.data.args)).catch(err=>{plot.textContent='Map rendering failed: '+err;busy=false;});});
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:710});
</script></body></html>
